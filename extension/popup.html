<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>I AM EVERYWHERE</title>
<style>
*{box-sizing:border-box}body{width:340px;margin:0;padding:18px;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}h1{font-size:30px;line-height:.85;letter-spacing:-1.7px;margin:0 0 16px}.small{font-size:10px;letter-spacing:.12em;opacity:.55;line-height:1.35;margin-bottom:12px}button,label{font:inherit}.add{display:block;width:100%;padding:12px;border:1px solid #666;background:#050505;color:#fff;font-weight:900;cursor:pointer;text-align:center;margin-bottom:10px}input{display:none}.carousel{position:relative;width:100%;height:190px;background:#111;overflow:hidden;margin-bottom:8px}#preview{width:100%;height:100%;object-fit:cover;display:none}#empty{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;font-size:12px;line-height:1.4;opacity:.45}.nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:52px;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:28px;cursor:pointer}#prev{left:0}#next{right:0}.nav:disabled{display:none}.counter{display:flex;justify-content:space-between;align-items:center;min-height:26px;margin-bottom:10px;font-size:10px;letter-spacing:.08em;opacity:.7}#remove{border:0;background:none;color:#fff;font-size:10px;text-decoration:underline;cursor:pointer;padding:4px 0}#remove:disabled{display:none}.action{width:100%;display:block;padding:13px;border:0;font-weight:900;cursor:pointer;text-align:center}#go{background:#fff;color:#000;margin-bottom:8px}#gone{background:#242424;color:#fff;margin-bottom:8px}#test{background:#111;color:#fff;border:1px solid #444}#status{font-size:11px;line-height:1.4;opacity:.78;margin-top:12px;white-space:pre-wrap;max-height:120px;overflow:auto}
</style>
</head>
<body>
<h1>I AM<br>EVERYWHERE</h1>
<div class="small">FACEFUSION LOCAL ENGINE · MULTI FACE LIBRARY</div>
<label class="add" for="face">+ ADD A FACE</label>
<input id="face" type="file" accept="image/*" multiple>
<div class="carousel"><div id="empty">ADD YOUR FIRST FACE</div><img id="preview" alt="Selected source face"><button id="prev" class="nav" type="button" aria-label="Previous face">‹</button><button id="next" class="nav" type="button" aria-label="Next face">›</button></div>
<div class="counter"><span id="count">0 FACES</span><button id="remove" type="button">REMOVE</button></div>
<button id="go" class="action">I AM EVERYWHERE</button>
<button id="gone" class="action">I AM GONE AWAY</button>
<button id="test" class="action">TEST FACEFUSION BRIDGE</button>
<div id="status">Start the local bridge first.</div>
<script src="popup.js"></script>
</body>
</html>
